[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokyo-run-agent"
version = "0.1.0"
description = "Plans Tokyo running loops with fewer traffic lights, plus fuelling plans."
requires-python = ">=3.11"
dependencies = [
  "anthropic",
  "claude-agent-sdk",
  "mcp>=2",
  "pydantic>=2",
  "python-dotenv",
  "requests",
  "osmnx>=2.0",
  "networkx",
  "gpxpy",
  "fitdecode",
  "folium",
  "garminconnect",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
tra = "tokyo_run_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real external APIs (costs money)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100